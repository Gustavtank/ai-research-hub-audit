      - /tmp
    volumes:
      - type: bind
        source: C:/AI_RESEARCH_HUB
        target: /hub
        read_only: true
      - type: bind
        source: C:/AI_RESEARCH_HUB/RESEARCH/WORK/agent-c
        target: /hub/RESEARCH/WORK/agent-c
        read_only: false
